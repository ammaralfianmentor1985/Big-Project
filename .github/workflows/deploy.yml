# Prerequisite (one-time, done by a repo admin):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# GitHub's auto-created "github-pages" environment only accepts deployments
# from the repo's default branch. The deploy job is gated to `main` below so
# feature-branch PRs get real analyze/test/build validation without a
# structurally-expected-to-fail deploy job turning CI red.
name: Build and deploy Satu

on:
  push:
    branches:
      - main
      - claude/life-management-app-planning-vqsbsd
  workflow_dispatch:

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/Big-Project/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
