# Prerequisite (one-time, done by a repo admin):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# GitHub's auto-created "github-pages" environment only accepts deployments
# from the repo's default branch. The deploy job is gated to `main` below so
# feature-branch PRs still get validated without a structurally-doomed
# deploy job turning CI red.
name: Validate and deploy Satu

on:
  push:
    branches:
      - main
      - claude/life-management-app-planning-vqsbsd
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every HTML file is well-formed
        run: |
          shopt -s globstar
          for f in web/**/*.html; do
            python3 -c "
          import sys
          from html.parser import HTMLParser
          class Check(HTMLParser):
              def error(self, message): sys.exit(f'HTML error in ${f}: {message}')
          Check().feed(open('$f').read())
          "
          done

      - name: Check every JSON file is well-formed
        run: |
          shopt -s globstar
          for f in web/**/*.json; do
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done

      - name: Run JS unit tests
        run: node --test

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
